<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div id="calculator">
        <input type="text" id="input" value="" readonly>

        <div id="buttons-grid">
            <button id="clr" class="operator">C</button>
            <button id="divide" class="operator">/</button>
            <button id="multiply" class="operator">*</button>
            
            <button id="block7">7</button>
            <button id="block8">8</button>
            <button id="block9">9</button>
            <button id="minus" class="operator">-</button>
            
            <button id="block4">4</button>
            <button id="block5">5</button>
            <button id="block6">6</button>
            <button id="plus" class="operator">+</button>
            
            <button id="block1">1</button>
            <button id="block2">2</button>
            <button id="block3">3</button>
            
            <button id="block0">0</button>
            <button id="dot" class="operator">.</button>
            <button id="ans" class="equals">=</button>
        </div>
    </div>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
